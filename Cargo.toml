[package]
name = "kytti"
version = "0.1.0"
edition = "2024"
description = "Typed read-only HashiCorp Vault gateway exposed as a streamable-http MCP"
license = "MIT"
repository = "https://github.com/calibrae/kytti"

[dependencies]
rmcp = { version = "1.5", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal", "sync", "fs", "net", "time"] }
tokio-util = "0.7"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
arc-swap = "1.7"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "1.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
